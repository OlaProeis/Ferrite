      pie: Výsečové grafy znázorňují podíly celku pomocí popsaných číselných 
        výsečí.
      gantt: Ganttovy diagramy rozmisťují úkoly na časové ose se sekcemi a 
        dobami trvání.
      journey: Mapy cesty uživatele bodují kroky v sekcích pro uživatele nebo 
        účastníky.
      mindmap: Myšlenkové mapy paprskovitě větví témata z centrálního kořene.
      timeline: Časové osy uvádějí datované názvy podél vodorovné osy.
      gitgraph: Graf Gitu zobrazuje commity a větve v linearizovaném pohledu na 
        historii.
